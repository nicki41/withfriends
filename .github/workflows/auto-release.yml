name: Auto Release

# Releases automatically after a push to master that changes anything besides
# docs/CI metadata, instead of requiring a manual tag every time. Always
# bumps the patch component of the plain "X.Y.Z" version in pom.xml - a
# minor/major bump is a deliberate decision made by hand (edit pom.xml
# yourself and push; this workflow bumps whatever it finds).
#
# What "notable" means here: the push touched at least one file outside
# .github/, README.md, and LICENSE - see the "Determine whether this push is
# notable" step below for the exact list. A pure documentation or
# workflow-only push is skipped.
#
# Deliberately two jobs, not one:
# - `prepare` decides notability, bumps <version> in pom.xml (and, through
#   Maven resource filtering, plugin.yml's version with it - see pom.xml's
#   <resources>), then commits and tags that on `master` using the default
#   GITHUB_TOKEN.
# - `release` calls release.yml directly via `workflow_call`, rather than
#   relying on the tag push from `prepare` to trigger it: GitHub does not
#   fire further workflow runs from a push made with the default
#   GITHUB_TOKEN (its built-in recursion guard), so a plain `git push` of the
#   tag here would otherwise publish nothing. `workflow_call` runs
#   release.yml's job directly as part of *this* run instead of depending on
#   that push triggering a separate one.
#
# The guard on the `prepare` job's own `if:` (skip when the triggering
# commit's message starts with "Release ") is a second, independent safety
# net against a release-commit-triggers-another-release loop, in case this
# workflow is ever changed to push with something other than GITHUB_TOKEN.

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: auto-release-master
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version and tag
    if: "!startsWith(github.event.head_commit.message, 'Release ')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      notable: ${{ steps.decide.outputs.notable }}
      tag: ${{ steps.decide.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine whether this push is notable
        id: touched
        run: |
          set -euo pipefail
          LAST_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$LAST_TAG" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          else
            BASE="$LAST_TAG"
          fi
          echo "Comparing against: $BASE"
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "$CHANGED"
          # Excluded: pure documentation and CI/repo-meta files. Everything
          # else (src/, pom.xml, ...) counts as notable.
          NOTABLE="$(echo "$CHANGED" | grep -vE '^(\.github/|README\.md$|LICENSE$|\.gitignore$|assets/)' || true)"
          if [ -z "$NOTABLE" ]; then
            echo "notable=false" >> "$GITHUB_OUTPUT"
          else
            echo "notable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        if: steps.touched.outputs.notable == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # Builds the tree exactly as pushed, before touching version metadata -
      # so a broken build never gets tagged and handed to release.yml (which
      # would build again and simply fail, but only after already consuming
      # a version number and leaving a dangling "Release" commit behind).
      - name: Build
        if: steps.touched.outputs.notable == 'true'
        run: mvn -B package

      # Computes the version, edits pom.xml, commits, tags, and pushes -
      # retried from a fresh `git fetch` + `reset --hard` on a rejected push
      # (master moved between checkout and push) rather than failing
      # outright. Recomputes everything from the new tip on each attempt
      # instead of rebasing the old commit onto it. Not re-run: the "Build"
      # step above, which only ever validated the tree as originally checked
      # out - acceptable since a retry only ever happens because *another
      # already-pushed, independently-built* commit landed first, not
      # because this run's own tree changed.
      - name: Bump version, commit, tag, and push (retried on a push race)
        id: decide
        if: steps.touched.outputs.notable == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "::group::Attempt ${attempt}/5"
            git fetch origin master
            git reset --hard origin/master

            CURRENT="$(grep -m1 -E '^    <version>' pom.xml | sed -E 's|.*<version>(.*)</version>.*|\1|')"
            if [[ ! "$CURRENT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Version on origin/master ('$CURRENT') is not a plain X.Y.Z version - can't auto-bump it. Fix pom.xml and release manually."
              exit 1
            fi
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            TAG="v${VERSION}"
            echo "Current: $CURRENT -> Next: $VERSION"

            sed -i "0,/^    <version>.*<\/version>/s//    <version>${VERSION}<\/version>/" pom.xml
            grep -q "^    <version>${VERSION}</version>\$" pom.xml

            git add pom.xml
            git commit -m "Release ${VERSION}"

            # The branch push is the race-prone one (rejected if master moved
            # since the reset above); only tag - a brand new name each time,
            # nothing to race against - once that commit has actually
            # landed, so a rejected branch push never leaves an orphaned tag
            # behind.
            if git push origin HEAD:master; then
              git tag "$TAG"
              git push origin "$TAG"
              echo "notable=true" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "::endgroup::"
              exit 0
            fi

            echo "::warning::Push rejected on attempt ${attempt} (someone else pushed first) - retrying from the new tip."
            echo "::endgroup::"
          done

          echo "::error::Could not push the release commit/tag after 5 attempts - master kept moving faster than this job could keep up. Not releasing this run; the next notable push will try again."
          exit 1

  release:
    name: Build and publish release
    needs: prepare
    if: needs.prepare.outputs.notable == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # A called reusable workflow gets NO repository secrets by default -
    # only secrets: inherit forwards them. Without this, MODRINTH_TOKEN
    # silently arrives empty on this path (GITHUB_TOKEN still works, since
    # that one is generated per-run rather than being a stored secret).
    secrets: inherit
    with:
      tag: ${{ needs.prepare.outputs.tag }}
