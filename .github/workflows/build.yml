name: Build

# Compiles and packages the plugin on every push and PR against master. Never
# publishes anything - it only uploads the jar as a temporary, traceable
# Actions artifact. See release.yml and auto-release.yml for publishing.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: withfriends-jar
          path: target/withfriends-*.jar
