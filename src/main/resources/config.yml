# ============================================================================
# withfriends configuration
# All display text lives in the language files under lang/ (en.yml, de.yml),
# selected below with general.language. This file only holds behavior and
# formatting settings. Both use MiniMessage formatting:
# https://docs.advntr.dev/minimessage/format.html
# ============================================================================

general:
  # Language for all plugin messages. Available: en, de.
  language: en

# Anonymous usage statistics: plugin id, a random installation id, plugin/
# Minecraft/Java versions, and online/max player counts - nothing that
# identifies this server. Sent to the official nicki41-telemetry instance,
# which is fixed and not configurable here.
telemetry:
  # false switches statistics off completely - no request of any kind is
  # made, no installation id is generated. Read again on every heartbeat,
  # so a restart is only needed to turn it back on, not off.
  enabled: true

join:
  # Replace Minecraft's default join message.
  enabled: true

leave:
  # Replace Minecraft's default leave message.
  enabled: true

features:
  # Every module can be enabled or disabled independently.
  nametag-hearts: true
  tablist-world-prefix: true
  deaths: true
  death-messages: true
  join-summary: true
  afk: true
  playtime-command: true
  seen-command: true
  coords-command: true
  distance-command: true
  private-messages: true
  enderchest: true
  custom-chat: true
  sleep: true
  sitting: true
  death-chest: true

join-summary:
  # Choose which lines a player receives after joining.
  show-online: true
  show-time: true
  show-deaths: true
  # Show at most this many names, then append "+x". Use 0 for count only.
  max-player-names: 20

tablist:
  # How often world prefixes and AFK suffixes are refreshed, in seconds.
  update-interval-seconds: 5

# This single set of colored, bracketed world tags is used everywhere a world/dimension is shown:
# the tab list, chat, /coords, /msg, and death (chest) messages - so it always looks the same.
# {world} is replaced with the translated world name from the language file.
world-prefixes:
  overworld: "<green><gray>[</gray>{world}<gray>]</gray></green> "
  nether: "<red><gray>[</gray>{world}<gray>]</gray></red> "
  end: "<light_purple><gray>[</gray>{world}<gray>]</gray></light_purple> "
  custom: "<white><gray>[{world}]</gray></white> "

nametag:
  # Objective names must be short and unique server-wide.
  hearts-objective-name: wf_health
  hearts-display-name: "<red>❤</red>"

deaths:
  # The death count is stored per UUID in plugins/withfriends/players.json.
  enabled: true
  # Display mode: tablist, scoreboard, both, or none.
  display: tablist
  # "both" needs two objectives because Minecraft can only show an objective once.
  tablist-objective-name: wf_deaths_tab
  scoreboard-objective-name: wf_deaths_sb

death-messages:
  # server sends the message to everyone; player sends it only to the player who died.
  scope: server
  show-coordinates: true
  show-dimension: true
  # When coordinates are shown, clicking the death message copies them.
  click-to-copy: true

afk:
  # Seconds without movement, interaction, command or chat before a player is AFK.
  timeout-seconds: 300
  announce: true
  # AFK players can be excluded from the sleep vote and protected from damage.
  ignore-for-sleep: true
  damage-immunity: true
  knockback-immunity: true
  # Prevents AFK players from being pushed around by mob or player collision.
  collision-immunity: true

chat:
  # Use {player} exactly once. {world} can be placed anywhere or removed.
  format: "{world}<white>{player}<dark_gray>:</dark_gray> "
  # Uses the world-prefixes tags above.
  show-world: true

enderchest:
  # false opens a read-only preview of your own chest. true lets you edit and save it.
  # Someone else's chest (/enderchest <player>) is always read-only, regardless of this setting.
  allow-edit: false

sitting:
  # Right-click a slab or stair to sit down.
  only-empty-hand: true

death-chest:
  # When to place a chest holding a player's dropped items instead of scattering them on the ground.
  # always: every death gets a chest.
  # lava-only: a chest is only placed when lava is within "lava-radius" blocks of the death point; otherwise items drop normally like vanilla.
  mode: always
  # Only used when mode is "lava-only".
  lava-radius: 3
  # How long a placed chest sticks around.
  # permanent: the chest stays until it is emptied by a player.
  # timed: the chest is removed automatically after "expire-seconds", dropping any leftover items on the ground.
  persistence: permanent
  # Only used when persistence is "timed".
  expire-seconds: 600
  # Send the owner a warning this many seconds before a timed chest expires. Use 0 to disable.
  warn-before-expire-seconds: 60
  # If true, only the player who died (and admins with withfriends.admin) can open their death chest.
  owner-only: false
  # How far (in blocks) to search around the death point for a free spot to place the chest.
  # A double chest is used automatically if the dropped items don't fit into a single chest (27 slots).
  search-radius: 4
  # Remove the chest block automatically once all items have been taken out.
  remove-when-empty: true

sleep:
  # Only Overworld players are counted. Nether and End players are ignored.
  # percent: A percentage of players must sleep.
  # fixed: The exact player count below must sleep.
  mode: percent
  percent: 75
  fixed-players: 1
  ignore-spectators: true
  # Thunderstorms can be skipped during the day as well as nights.
  clear-weather: true
  announce-progress: true
  announce-success: true
  # Phantom reset mode: sleeping, all, or none.
  phantom-reset: sleeping
  skip-animation:
    enabled: true
    particles: 30
